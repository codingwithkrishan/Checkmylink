<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 90" width="100%" height="100%" fill="none">
  <defs>
    <!-- Shield Outer Gradient -->
    <linearGradient id="cmlShieldBorderFull" x1="15%" y1="5%" x2="85%" y2="95%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="45%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>

    <!-- Shield Inner Fill Gradient -->
    <linearGradient id="cmlShieldBgFull" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#0F2147"/>
      <stop offset="100%" stop-color="#080F1F"/>
    </linearGradient>

    <!-- Link Ring Gradient -->
    <linearGradient id="cmlLinkGradFull" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E0F2FE"/>
      <stop offset="60%" stop-color="#93C5FD"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>

    <!-- Security Checkmark Gradient (Cyber Orange) -->
    <linearGradient id="cmlCheckGradFull" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFA24C"/>
      <stop offset="50%" stop-color="#FF6B00"/>
      <stop offset="100%" stop-color="#E05300"/>
    </linearGradient>

    <!-- Text Gradient -->
    <linearGradient id="cmlTitleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#60A5FA"/>
      <stop offset="50%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#FF8A00"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="cmlGlowFull" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- EMBLEM ICON (LEFT) -->
  <g transform="translate(10, 5) scale(0.666)">
    <!-- Background Shield Aura -->
    <path d="M60 10 L100 25 C100 68 79 97 60 110 C41 97 20 68 20 25 Z" 
          fill="none" stroke="#2563EB" stroke-width="6" opacity="0.25" filter="url(#cmlGlowFull)"/>

    <!-- Shield Base -->
    <path d="M60 10 L100 25 C100 68 79 97 60 110 C41 97 20 68 20 25 Z" 
          fill="url(#cmlShieldBgFull)" 
          stroke="url(#cmlShieldBorderFull)" 
          stroke-width="3" 
          stroke-linejoin="round"/>

    <!-- Shield Inner Accent -->
    <path d="M60 17 L93 29.5 C93 65.5 75 90.5 60 102 C45 90.5 27 65.5 27 29.5 Z" 
          fill="none" stroke="#38BDF8" stroke-width="1" stroke-dasharray="4 2" opacity="0.35"/>

    <!-- Hyperlink Loops -->
    <g transform="translate(60,54) scale(0.92) translate(-60,-54)">
      <path d="M47 38 C41.5 32.5 32.5 32.5 27 38 C21.5 43.5 21.5 52.5 27 58 L37 68 C42.5 73.5 51.5 73.5 57 68" 
            fill="none" stroke="url(#cmlLinkGradFull)" stroke-width="5.5" stroke-linecap="round"/>
      <path d="M63 40 C68.5 34.5 77.5 34.5 83 40 C88.5 45.5 88.5 54.5 83 60 L73 70 C67.5 75.5 58.5 75.5 53 70" 
            fill="none" stroke="url(#cmlLinkGradFull)" stroke-width="5.5" stroke-linecap="round"/>
      <line x1="43" y1="52" x2="67" y2="52" stroke="#60A5FA" stroke-width="3.5" stroke-linecap="round" opacity="0.75"/>
    </g>

    <!-- Security Checkmark -->
    <path d="M40 59 L54 73 L84 41" 
          fill="none" stroke="url(#cmlCheckGradFull)" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#cmlGlowFull)"/>
    <circle cx="84" cy="41" r="3" fill="#FFF"/>
  </g>

  <!-- BRAND TYPOGRAPHY (RIGHT) -->
  <text x="100" y="47" font-family="'Inter', -apple-system, BlinkMacSystemFont, sans-serif" font-weight="900" font-size="28" letter-spacing="1.5" fill="#FFFFFF">
    CHECK <tspan fill="url(#cmlCheckGradFull)">MY</tspan> <tspan fill="#60A5FA">LINK</tspan>
  </text>
  <text x="102" y="68" font-family="'JetBrains Mono', monospace, sans-serif" font-weight="600" font-size="11" letter-spacing="3.5" fill="#94A3B8">
    URL THREAT INTELLIGENCE
  </text>
</svg>
