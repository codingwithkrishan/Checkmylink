<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%" fill="none">
  <defs>
    <!-- Shield Outer Gradient -->
    <linearGradient id="cmlShieldBorder" x1="15%" y1="5%" x2="85%" y2="95%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="45%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>

    <!-- Shield Inner Fill Gradient -->
    <linearGradient id="cmlShieldBg" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#0F2147"/>
      <stop offset="100%" stop-color="#080F1F"/>
    </linearGradient>

    <!-- Link Ring Gradient -->
    <linearGradient id="cmlLinkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E0F2FE"/>
      <stop offset="60%" stop-color="#93C5FD"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>

    <!-- Security Checkmark Gradient (Cyber Orange) -->
    <linearGradient id="cmlCheckGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFA24C"/>
      <stop offset="50%" stop-color="#FF6B00"/>
      <stop offset="100%" stop-color="#E05300"/>
    </linearGradient>

    <!-- Soft Glow Filter -->
    <filter id="cmlGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="cmlCheckGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background Shield Shadow/Aura -->
  <path d="M60 10 L100 25 C100 68 79 97 60 110 C41 97 20 68 20 25 Z" 
        fill="none" stroke="#2563EB" stroke-width="6" opacity="0.25" filter="url(#cmlGlow)"/>

  <!-- Shield Base Body -->
  <path d="M60 10 L100 25 C100 68 79 97 60 110 C41 97 20 68 20 25 Z" 
        fill="url(#cmlShieldBg)" 
        stroke="url(#cmlShieldBorder)" 
        stroke-width="3" 
        stroke-linejoin="round"/>

  <!-- Shield Inner Accent Line -->
  <path d="M60 17 L93 29.5 C93 65.5 75 90.5 60 102 C45 90.5 27 65.5 27 29.5 Z" 
        fill="none" 
        stroke="#38BDF8" 
        stroke-width="1" 
        stroke-dasharray="4 2" 
        opacity="0.35"/>

  <!-- HYPERLINK SYMBOL (Two Interlocking Angled Links) -->
  <g transform="translate(60,54) scale(0.92) translate(-60,-54)">
    <!-- Link Loop 1 (Upper Left) -->
    <path d="M47 38 C41.5 32.5 32.5 32.5 27 38 C21.5 43.5 21.5 52.5 27 58 L37 68 C42.5 73.5 51.5 73.5 57 68" 
          fill="none" 
          stroke="url(#cmlLinkGrad)" 
          stroke-width="5.5" 
          stroke-linecap="round"/>

    <!-- Link Loop 2 (Lower Right) -->
    <path d="M63 40 C68.5 34.5 77.5 34.5 83 40 C88.5 45.5 88.5 54.5 83 60 L73 70 C67.5 75.5 58.5 75.5 53 70" 
          fill="none" 
          stroke="url(#cmlLinkGrad)" 
          stroke-width="5.5" 
          stroke-linecap="round"/>

    <!-- Central Link Connector Beam -->
    <line x1="43" y1="52" x2="67" y2="52" 
          stroke="#60A5FA" 
          stroke-width="3.5" 
          stroke-linecap="round" 
          opacity="0.75"/>
  </g>

  <!-- SECURITY CHECKMARK (Bold Cyber-Orange Verification Check) -->
  <g filter="url(#cmlCheckGlow)">
    <path d="M40 59 L54 73 L84 41" 
          fill="none" 
          stroke="url(#cmlCheckGrad)" 
          stroke-width="6.5" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>
  </g>

  <!-- Verification Pulse Dot at Checkmark Tip -->
  <circle cx="84" cy="41" r="3" fill="#FFF" opacity="0.95"/>
  <circle cx="84" cy="41" r="5" fill="#FF8A00" opacity="0.4" filter="url(#cmlGlow)"/>

  <!-- Top Shield Security Radar Dot -->
  <circle cx="60" cy="18" r="2" fill="#38BDF8"/>
</svg>
